            function esc(s) {
                return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
                    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
                });
            }

            function buildOrderTypeSelectHtml(selectId, selectedValue, styleStr) {
                var orderTypes = BOOT.orderTypes || [];
                if (!selectedValue) {
                    var defaultType = (BOOT.defaultOrderType || 'Regular').toString().toLowerCase().trim();
                    for (var i = 0; i < orderTypes.length; i++) {
                        var idStr = (orderTypes[i].id || '').toString().toLowerCase().trim();
                        var nameStr = (orderTypes[i].name || '').toString().toLowerCase().trim();
                        if (idStr === defaultType || nameStr === defaultType) {
                            selectedValue = orderTypes[i].id;
                            break;
                        }
                    }
                }
                var h = '<select id="' + selectId + '"' + (styleStr ? ' style="' + styleStr + '"' : '') + '>';
                h += '  <option value="">-- Select Order Type --</option>';
                orderTypes.forEach(function (ot) {
                    var selected = String(ot.id) === String(selectedValue || '') ? ' selected' : '';
                    h += '  <option value="' + esc(ot.id) + '"' + selected + '>' + esc(ot.name) + '</option>';
                });
                h += '</select>';
                return h;
            }

            function parseNsDate(dateStr) {
                if (!dateStr) return null;
                var parts = dateStr.split('/');
                if (parts.length === 3) {
                    var m = parseInt(parts[0], 10) - 1;
                    var d = parseInt(parts[1], 10);
                    var y = parseInt(parts[2], 10);
                    return new Date(y, m, d);
                }
                var parsed = Date.parse(dateStr);
                if (!isNaN(parsed)) {
                    return new Date(parsed);
                }
                return null;
            }

            var ACTIVE_DRAFT_ID = null;

            function getDraftsForCustomer(custId) {
                try {
                    var data = localStorage.getItem('portal_drafts_list_' + custId);
                    if (data) {
                        return JSON.parse(data);
                    }
                } catch (e) {
                    console.error('Error getting drafts list', e);
                }
                // Migration path from old single draft format
                try {
                    var oldData = localStorage.getItem('portal_draft_' + custId);
                    if (oldData) {
                        var parsed = JSON.parse(oldData);
                        localStorage.removeItem('portal_draft_' + custId);
                        var oldDraft = {
                            id: 'draft_' + (Date.now() - 1000),
                            timestamp: Date.now() - 1000,
                            lines: parsed.lines || [],
                            po: parsed.po || '',
                            notes: parsed.notes || '',
                            orderType: parsed.orderType || '',
                            editSoId: parsed.editSoId || '',
                            editSoNum: parsed.editSoNum || '',
                            salesrepId: parsed.salesrepId || '',
                            copiedFromSoId: parsed.copiedFromSoId || ''
                        };
                        var list = [oldDraft];
                        localStorage.setItem('portal_drafts_list_' + custId, JSON.stringify(list));
                        return list;
                    }
                } catch (e) {
                    console.error('Error migrating old draft', e);
                }
                return [];
            }

            function saveDraftsListForCustomer(custId, list) {
                try {
                    localStorage.setItem('portal_drafts_list_' + custId, JSON.stringify(list));
                } catch (e) {
                    console.error('Error saving drafts list', e);
                }
            }

            function getDraftCart(custId) {
                var list = getDraftsForCustomer(custId);
                if (!ACTIVE_DRAFT_ID) {
                    if (list.length > 0) {
                        return list[0]; // Default to the most recent one if no active draft ID is set
                    }
                    return null;
                }
                for (var i = 0; i < list.length; i++) {
                    if (list[i].id === ACTIVE_DRAFT_ID) {
                        return list[i];
                    }
                }
                return null;
            }

            function saveDraftCart(custId, cart, po, notes, orderType, editSoId, editSoNum, salesrepId, copiedFromSoId) {
                var list = getDraftsForCustomer(custId);
                var activeDraft = null;
                
                if (ACTIVE_DRAFT_ID) {
                    for (var i = 0; i < list.length; i++) {
                        if (list[i].id === ACTIVE_DRAFT_ID) {
                            activeDraft = list[i];
                            break;
                        }
                    }
                }
                
                if (!activeDraft) {
                    // Create a new draft
                    ACTIVE_DRAFT_ID = 'draft_' + Date.now();
                    activeDraft = {
                        id: ACTIVE_DRAFT_ID,
                        timestamp: Date.now()
                    };
                    list.unshift(activeDraft); // Put at front
                } else {
                    activeDraft.timestamp = Date.now();
                    // Move it to the front of the list
                    var idx = list.indexOf(activeDraft);
                    if (idx > -1) {
                        list.splice(idx, 1);
                        list.unshift(activeDraft);
                    }
                }
                
                activeDraft.lines = cart;
                activeDraft.po = po || '';
                activeDraft.notes = notes || '';
                activeDraft.orderType = orderType || '';
                activeDraft.editSoId = editSoId || '';
                activeDraft.editSoNum = editSoNum || '';
                activeDraft.salesrepId = salesrepId || '';
                activeDraft.copiedFromSoId = copiedFromSoId || '';
                
                // Limit list to max 10 drafts
                if (list.length > 10) {
                    list = list.slice(0, 10);
                }
                
                saveDraftsListForCustomer(custId, list);
            }

            function clearDraftCart(custId, draftId) {
                var targetId = draftId || ACTIVE_DRAFT_ID;
                if (!targetId) {
                    var list = getDraftsForCustomer(custId);
                    if (list.length > 0) {
                        targetId = list[0].id;
                    }
                }
                if (!targetId) return;
                var list = getDraftsForCustomer(custId);
                list = list.filter(function (d) {
                    return d.id !== targetId;
                });
                saveDraftsListForCustomer(custId, list);
                if (ACTIVE_DRAFT_ID === targetId) {
                    ACTIVE_DRAFT_ID = null;
                }
            }

                searchInput = document.getElementById('modal-cust-search');
                searchInput.addEventListener('input', function () {
                    var term = this.value.toLowerCase().trim();
                    var items = custListContainer.querySelectorAll('.rep-item');
                    Array.prototype.forEach.call(items, function (item) {
                        var name = item.getAttribute('data-name');
                        if (!term || name.indexOf(term) >= 0) {
                            item.style.display = '';
                        } else {
                            item.style.display = 'none';
                        }
                    });
                });

                closeBtn.replaceWith(closeBtn.cloneNode(true));
                closeBtn = document.getElementById('modal-cust-close-btn');
                closeBtn.addEventListener('click', function () {
                    modal.classList.remove('open');
                });

                cancelBtn.replaceWith(cancelBtn.cloneNode(true));
                cancelBtn = document.getElementById('btn-cust-modal-cancel');
                cancelBtn.addEventListener('click', function () {
                    modal.classList.remove('open');
                });

                applyBtn.replaceWith(applyBtn.cloneNode(true));
                applyBtn = document.getElementById('btn-cust-modal-apply');
                applyBtn.addEventListener('click', function () {
                    var selectAllChk = document.getElementById('chk-select-all-custs');
                    var chks = custListContainer.querySelectorAll('.cust-chk');
                    var selected = [];

                    Array.prototype.forEach.call(chks, function (c) {
                        if (c.checked) {
                            selected.push(String(c.value));
                        }
                    });

                    var selectAll = selectAllChk.checked;
                    if (!selectAll && selected.length === 0) {
                        alert('Please select at least one customer or check "Select All".');
                        return;
                    }

                    SELECT_ALL_CUSTS = selectAll;
                    SELECTED_CUSTS = selected;

                    modal.classList.remove('open');
                    renderCustomers(ALL_CUST);
                });

                modal.classList.add('open');
            }

            /* ---------- boot ---------- */
            renderBrand();
            if (BOOT.stage === 'app') {
                IS_ADMIN = BOOT.isAdmin || false;
                SALES_REPS = BOOT.salesReps || [];

                if (IS_ADMIN) {
                    try {
                        var storedAll = sessionStorage.getItem('select_all_reps');
                        if (storedAll !== null) {
                            SELECT_ALL_REPS = storedAll === 'true';
                        }
                        var storedReps = sessionStorage.getItem('selected_reps');
                        if (storedReps) {
                            SELECTED_REPS = JSON.parse(storedReps);
                        }
                    } catch (e) { }
                }

                setLogout(true);

                if (BOOT.targetRequestId || BOOT.targetOppId) {
                    if (IS_ADMIN) {
                        loadCustomers();
                    }
                    ACTIVE_TAB = 'drafts';
                    renderDraftsTab();
                } else {
                    if (IS_ADMIN) {
                        var hasSelection = !SELECT_ALL_REPS || SELECTED_REPS.length > 0;
                        if (hasSelection || sessionStorage.getItem('select_all_reps') !== null) {
                            loadCustomers();
                        } else {
                            renderCustomers([]);
                            openRepsModal(true);
                        }
                    } else {
                        ALL_CUST = BOOT.customers || [];
                        renderCustomers(ALL_CUST);
                    }
                }
            } else {
                renderLogin();
            }
        })();
    </script>
</body>

</html>
